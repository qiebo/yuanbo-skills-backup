project:
  name: "示例教育项目"
  document_type: "A"
  client: "示例学校"
  title: "示例学校示例项目建设方案"
  version: "v1.0"
  date: "2026年7月"
  language: "zh-CN"
  # 封面标签（保密级别/版本说明）。按交付对象选择；留空（""）则封面不显示该标签。
  # 常用：内部资料 / 客户交流版 / 提交版 / 征求意见稿
  confidentiality: "客户交流版"
  # 节点确认强度（见 SKILL.md §2.4）：full=全自主 / core=仅核心节点(默认) / each=逐节点确认
  confirmation_mode: "core"
  # 外部权威文件（可选）：当设备命名 / 价格 / 交付方式以项目外另一份权威清单为准时填写其路径或文件名。
  # 该清单是命名与价格的唯一来源；Word 正文仅做概念引用、不展开细化；
  # 项目内与其同名的旧清单须显式标注"参考样例 / 作废"，避免与权威版本冲突。
  # external_authoritative: ""

output:
  filename: "示例学校示例项目建设方案_v1.0.docx"
  stylepack: "学校建设方案版.docx"
  toc: true
  toc_mode: "static"
  numbered_sections: false
  header_text: "示例学校示例项目建设方案"
  footer_page_number: true
  # 正文与表格统一字体（默认微软雅黑）；构建时强制应用到正文、表格单元格、页眉页脚
  font: "微软雅黑"
  # 正文段首缩进（按字符数；2 = 段首空两格）。设为 0 关闭。
  first_line_indent: 2

validation:
  required_claim_coverage: 0.95
  high_risk_claim_coverage: 1.0
  require_zero_blocking_pending: true
  require_requirement_coverage: 1.0
  amount_tolerance: 0.01

review:
  required_roles:
    - "教育方案评审"
    - "课程实施评审"
    - "工程设备评审"
    - "政策合规评审"
